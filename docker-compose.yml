# ViaCRM front end + backend + Postgres + Mailpit, all in Docker.
#   docker compose up -d --build
# Front end: http://localhost:5173   Mailpit (every e-mail the system sends): http://localhost:8025
# Login: admin@example.com / admin-dev-password-1
# The backend is built from ../viacrm-be (branch dot-net). For day-to-day development you can instead run the backend
# with ../viacrm-be/scripts/run.sh and the front end with `npm run dev` (Vite proxies /v1 to localhost:5080).
services:
  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"
    restart: unless-stopped

  api:
    build:
      context: ../viacrm-be
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=viacrm;Username=viacrm;Password=viacrm
      # Development-only signing key (base64 of 32 bytes). Never use it outside local development.
      Auth__SigningKey: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
      Bootstrap__AdminEmail: admin@example.com
      Bootstrap__AdminPassword: admin-dev-password-1
      Mail__Smtp__Host: mailpit
      Mail__Smtp__Port: "1025"
      Mail__Smtp__From: viacrm@localhost
      # Links in e-mails point at the front end.
      Public__BaseUrl: http://localhost:5173
    volumes:
      - viacrm-files:/data
    ports:
      - "5080:8080"   # direct API access (curl, Vite dev server); the front end reaches it through its own /v1 proxy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: viacrm
      POSTGRES_USER: viacrm
      POSTGRES_PASSWORD: viacrm
    volumes:
      - viacrm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viacrm -d viacrm"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  viacrm-db:
  viacrm-files:
