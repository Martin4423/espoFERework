server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ViaCRM API (same origin, the API has no CORS). Uploads are limited to 25 MB by the API.
    location /v1/ {
        proxy_pass http://api:8080;
        client_max_body_size 30m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-sent events: no buffering, long read timeout.
    location = /v1/events {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The page itself is never cached (hashed assets under /assets are), so a rebuilt client is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
