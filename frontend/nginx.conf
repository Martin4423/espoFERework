server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /client/ {
        proxy_pass http://espocrm:80/client/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://espocrm:80;
        client_max_body_size 400m;
        client_body_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        if ($arg_entryPoint = loginAs) {
            return 418;
        }
        error_page 418 = @login_as;
        if ($arg_entryPoint = LogoImage) {
            return 419;
        }
        error_page 419 = @logo_image;
        if ($arg_entryPoint = CampaignTrackOpened) {
            rewrite ^ /api/v1/Campaign/trackOpened/$arg_id last;
        }
        try_files /index.html =404;
    }

    location @login_as {
        proxy_pass http://espocrm:80/?entryPoint=loginAs&anotherUser=$arg_anotherUser&username=$arg_username;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @logo_image {
        proxy_pass http://espocrm:80/?entryPoint=LogoImage&id=$arg_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
